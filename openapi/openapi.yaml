  /v1/chapters:
    get:
      operationId: listChapters
      tags: [Story]
      summary: List visible manga chapters
      parameters:
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AsOfChapter'
        - $ref: '#/components/parameters/MaxChapter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SortByNumber'
        - name: arc
          in: query
          description: Filter by the stable slug of the primary arc.
          schema:
            type: string
      responses:
