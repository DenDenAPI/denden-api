          $ref: '#/components/responses/ChapterCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/chapters/{number}:
    get:
      operationId: getChapter
      tags: [Story]
      summary: Get a manga chapter by its main-series number
      parameters:
        - name: number
          in: path
          required: true
          description: Positive number in the main manga sequence.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AsOfChapter'
        - $ref: '#/components/parameters/MaxChapter'
        - $ref: '#/components/parameters/Include'
