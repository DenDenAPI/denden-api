        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AsOfChapter'
        - $ref: '#/components/parameters/MaxChapter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SortBySlug'
      responses:
        '200':
          $ref: '#/components/responses/LocationCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/locations/{slug}:
    get:
      operationId: getLocation
      tags: [World]
      summary: Get a location by stable slug
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AsOfChapter'
        - $ref: '#/components/parameters/MaxChapter'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          $ref: '#/components/responses/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/devil-fruits:
    get:
      operationId: listDevilFruits
      tags: [World]
      summary: List visible Devil Fruits
      parameters:
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AsOfChapter'
        - $ref: '#/components/parameters/MaxChapter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/PageLimit'
