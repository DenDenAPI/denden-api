  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

    Metadata:
      type: object
      required: [apiVersion, datasetVersion, generatedAt, maxIngestedChapter, supportedLocales]
      properties:
        apiVersion:
          type: string
          examples: ['1']
        datasetVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        maxIngestedChapter:
          type: integer
          minimum: 0
        supportedLocales:
          type: array
          items:
            type: string
          examples: [[en, es]]

    Page:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']

    LocalizedResource:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          description: Opaque, immutable resource identity.
        slug:
          type: string
          description: Stable, non-localized public identifier.
        name:
          type: string
          description: Name resolved for this response's language selection.
        description:
          type: [string, 'null']
          description: Localized editorial summary, when available.

    ResourceReference:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string

    Character:
      allOf:
        - $ref: '#/components/schemas/LocalizedResource'
        - type: object
          properties:
            aliases:
              type: array
              items:
                type: string
            epithets:
              type: array
              items:
                type: string
            gender:
              $ref: '#/components/schemas/CharacterGender'
            birthday:
              $ref: '#/components/schemas/Birthday'
            age:
              type: integer
              minimum: 0
            heightCm:
              type: integer
              minimum: 0
            status:
              $ref: '#/components/schemas/CharacterStatus'
            races:
              type: array
              items:
                $ref: '#/components/schemas/ResourceReference'
            origin:
              $ref: '#/components/schemas/ResourceReference'
            debut:
              $ref: '#/components/schemas/ChapterReference'
            bounties:
              type: array
              description: Present when requested using the bounties include.
              items:
                $ref: '#/components/schemas/Bounty'
            organizations:
              type: array
              description: Direct memberships visible under the request filters.
              items:
                $ref: '#/components/schemas/ResourceReference'
            devilFruits:
              type: array
              items:
                $ref: '#/components/schemas/ResourceReference'
            haki:
              type: array
              items:
                type: string
                enum: [OBSERVATION, ARMAMENT, SUPREME_KING]
            statusHistory:
              type: array
              items:
                $ref: '#/components/schemas/CharacterStatusRecord'
            sources:
              type: array
              items:
                $ref: '#/components/schemas/Source'

    CharacterGender:
      type: string
      enum: [MALE, FEMALE, NON_BINARY, UNKNOWN, NOT_APPLICABLE]

    CharacterStatus:
      type: string
      enum: [ALIVE, DEAD, UNKNOWN]

    CharacterStatusRecord:
      type: object
      required: [status, availableFromChapter]
      properties:
        status:
          $ref: '#/components/schemas/CharacterStatus'
        validFromChapter:
          type: integer
          minimum: 1
        validToChapter:
          type: integer
          minimum: 1
        availableFromChapter:
          type: integer
          minimum: 1
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'

    Birthday:
      type: object
      required: [month, day]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31

    ChapterReference:
      type: object
      required: [number]
      properties:
        id:
          type: string
        number:
          type: integer
          minimum: 1

    Organization:
      allOf:
        - $ref: '#/components/schemas/LocalizedResource'
        - type: object
          required: [type]
          properties:
            type:
              $ref: '#/components/schemas/OrganizationType'
            status:
              $ref: '#/components/schemas/OrganizationStatus'
            memberCount:
              type: integer
              minimum: 0
              description: Visible active direct memberships only.
            totalBounty:
              type: integer
              minimum: 0
              description: Sum of visible ACTIVE bounties for visible active direct members.
            debut:
              $ref: '#/components/schemas/ChapterReference'
            members:
              type: array
              description: Visible active direct members, present when requested using the members include.
              items:
                $ref: '#/components/schemas/OrganizationMember'
            relationships:
              type: array
              items:
                $ref: '#/components/schemas/OrganizationRelationship'
            locations:
              type: array
              items:
                $ref: '#/components/schemas/OrganizationLocation'
            statusHistory:
              type: array
              items:
                $ref: '#/components/schemas/OrganizationStatusRecord'
            sources:
              type: array
              items:
                $ref: '#/components/schemas/Source'

    OrganizationType:
      type: string
      enum:
        - PIRATE_CREW
        - PIRATE_FLEET
        - ALLIANCE
        - GOVERNMENT
        - MILITARY
        - INTELLIGENCE_AGENCY
        - REVOLUTIONARY
        - CRIMINAL
        - BUSINESS
        - SCIENTIFIC
        - DIVISION
        - OTHER

    OrganizationStatus:
      type: string
      enum: [ACTIVE, DISBANDED, DESTROYED, UNKNOWN]

    OrganizationMember:
      type: object
      required: [character]
      properties:
        character:
          $ref: '#/components/schemas/ResourceReference'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/ResourceReference'

    OrganizationRelationship:
      type: object
      required: [organization, type]
      properties:
        organization:
          $ref: '#/components/schemas/ResourceReference'
        type:
          type: string
          enum: [SUBUNIT_OF, AFFILIATED_WITH, ALLIED_WITH, SUBORDINATE_TO, PREDECESSOR_OF, MERGED_INTO]
        validFromChapter:
          type: integer
          minimum: 1
        validToChapter:
          type: integer
          minimum: 1
        availableFromChapter:
          type: integer
          minimum: 1

    OrganizationLocation:
      type: object
      required: [location, type]
      properties:
        location:
          $ref: '#/components/schemas/ResourceReference'
        type:
          type: string
          enum: [HEADQUARTERS, BASE, ORIGIN, TERRITORY]

    OrganizationStatusRecord:
      type: object
      required: [status, availableFromChapter]
      properties:
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        validFromChapter:
          type: integer
          minimum: 1
        validToChapter:
          type: integer
          minimum: 1
        availableFromChapter:
          type: integer
          minimum: 1
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'

    Race:
      allOf:
        - $ref: '#/components/schemas/LocalizedResource'
        - type: object
          properties:
            parent:
              oneOf:
                - $ref: '#/components/schemas/ResourceReference'
                - type: 'null'

    Location:
      allOf:
        - $ref: '#/components/schemas/LocalizedResource'
        - type: object
          required: [type]
          properties:
            type:
              type: string
            parent:
              oneOf:
                - $ref: '#/components/schemas/ResourceReference'
                - type: 'null'

    DevilFruit:
      allOf:
        - $ref: '#/components/schemas/LocalizedResource'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [PARAMECIA, ZOAN, LOGIA, UNKNOWN]
            subtype:
              type: [string, 'null']

    Saga:
      allOf:
        - $ref: '#/components/schemas/LocalizedResource'
        - type: object
          required: [order, status]
          properties:
            order:
              type: integer
            status:
              $ref: '#/components/schemas/StoryStatus'

    Arc:
      allOf:
        - $ref: '#/components/schemas/LocalizedResource'
        - type: object
          required: [saga, orderWithinSaga, status]
          properties:
            saga:
              $ref: '#/components/schemas/ResourceReference'
            orderWithinSaga:
              type: integer
            status:
              $ref: '#/components/schemas/StoryStatus'

    StoryStatus:
      type: string
      enum: [ONGOING, COMPLETED]

    Chapter:
      type: object
      required: [id, number, coverType]
      properties:
        id:
          type: string
        number:
          type: integer
          minimum: 1
        title:
          type: [string, 'null']
          description: Localized chapter title.
        arc:
          oneOf:
            - $ref: '#/components/schemas/ResourceReference'
            - type: 'null'
        volume:
          oneOf:
            - $ref: '#/components/schemas/VolumeReference'
            - type: 'null'
        pageCount:
          type: [integer, 'null']
          minimum: 1
        japaneseReleaseDate:
          type: [string, 'null']
          format: date
        wsjIssue:
          type: [string, 'null']
        coverType:
          type: string
          enum: [STANDARD, COLOR_SPREAD, COVER_STORY, OTHER]

    VolumeReference:
      type: object
      required: [id, number]
      properties:
        id:
          type: string
        number:
          type: integer

    Volume:
      type: object
      required: [id, number]
      properties:
        id:
          type: string
        number:
          type: integer
          minimum: 1
        title:
          type: [string, 'null']
          description: Localized volume title.
        chapters:
          type: array
          description: Present when requested using the chapters include.
          items:
            $ref: '#/components/schemas/ChapterReference'
        editions:
          type: array
          description: Present when requested using the editions include.
          items:
            $ref: '#/components/schemas/VolumeEdition'

    VolumeEdition:
      type: object
      required: [id, locale, format]
      properties:
        id:
          type: string
        locale:
          type: string
        region:
          type: string
        format:
          type: string
          enum: [PAPERBACK, HARDCOVER, DIGITAL, COLORED, OTHER]
        localizedTitle:
          type: string
        pageCount:
          type: integer
          minimum: 1
        releaseDate:
          type: string
          format: date
        isbn:
          type: string
        publisher:
          type: string

    CoverStory:
      allOf:
        - $ref: '#/components/schemas/LocalizedResource'
        - type: object
          required: [order]
          properties:
            order:
              type: integer
            episodes:
              type: array
              description: Present when requested using the episodes include.
              items:
                $ref: '#/components/schemas/CoverStoryEpisode'

    CoverStoryEpisode:
      type: object
      required: [id, episodeNumber, chapter]
      properties:
        id:
          type: string
        episodeNumber:
          type: integer
          minimum: 1
        chapter:
          $ref: '#/components/schemas/ChapterReference'
        title:
          type: string
        description:
          type: string

    Source:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [MANGA_CHAPTER, SBS, VIVRE_CARD, DATABOOK, OTHER_OFFICIAL]
        chapter:
          oneOf:
            - $ref: '#/components/schemas/ChapterReference'
            - type: 'null'
        volume:
          oneOf:
            - $ref: '#/components/schemas/VolumeReference'
            - type: 'null'
        locator:
          type: [string, 'null']
        referenceLabel:
          type: [string, 'null']
        publicationDate:
          type: string
          format: date

    Bounty:
      type: object
      required: [amount, currency, status, availableFromChapter]
      properties:
        amount:
          type: integer
          minimum: 0
        currency:
          type: string
          const: BERRIES
        status:
          type: string
          enum: [ACTIVE, FROZEN, WITHDRAWN, UNKNOWN]
        validFromChapter:
          type: integer
          minimum: 1
        validToChapter:
          type: integer
          minimum: 1
        availableFromChapter:
          type: integer
          minimum: 1
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'

    CharacterCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Character'
        page:
          $ref: '#/components/schemas/Page'
    OrganizationCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        page:
          $ref: '#/components/schemas/Page'
    RaceCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Race'
        page:
          $ref: '#/components/schemas/Page'
    LocationCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        page:
          $ref: '#/components/schemas/Page'
    DevilFruitCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DevilFruit'
        page:
          $ref: '#/components/schemas/Page'
    SagaCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Saga'
        page:
          $ref: '#/components/schemas/Page'
    ArcCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Arc'
        page:
          $ref: '#/components/schemas/Page'
    ChapterCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
        page:
          $ref: '#/components/schemas/Page'
    VolumeCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Volume'
        page:
          $ref: '#/components/schemas/Page'
    CoverStoryCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CoverStory'
        page:
          $ref: '#/components/schemas/Page'
