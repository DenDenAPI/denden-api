openapi: 3.1.1
info:
  title: DenDenAPI
  version: 1.0.0
  summary: Proposed public REST API for structured One Piece data
  description: |
    Proposed v1 contract for review. This API is not implemented yet.
    The API exposes manga-first structured facts with language selection,
    historical views, spoiler caps, and compact official source references.
    DenDenAPI is an unofficial fan project; see the repository NOTICE.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Metadata
  - name: Characters
  - name: Organizations
  - name: World
  - name: Story
  - name: Sources
paths:
  /v1/meta:
    get:
      operationId: getMetadata
      tags: [Metadata]
      summary: Get dataset and API metadata
      responses:
        '200':
          description: Dataset metadata
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/LanguageVary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/characters:
    get:
      operationId: listCharacters
      tags: [Characters]
      summary: List visible characters
      description: Hidden characters are omitted. Pagination never exposes hidden records.
      parameters:
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AsOfChapter'
        - $ref: '#/components/parameters/MaxChapter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SortBySlug'
        - name: organization
          in: query
          description: Filter by the stable slug of a direct organization membership.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/CharacterCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/characters/{slug}:
    get:
      operationId: getCharacter
      tags: [Characters]
      summary: Get a character by stable slug
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AsOfChapter'
        - $ref: '#/components/parameters/MaxChapter'
        - $ref: '#/components/parameters/Include'
      responses:
        '200':
          description: Character projection
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
            Vary:
              $ref: '#/components/headers/LanguageVary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/organizations:
    get:
      operationId: listOrganizations
      tags: [Organizations]
      summary: List visible organizations
      parameters:
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AsOfChapter'
        - $ref: '#/components/parameters/MaxChapter'
        - $ref: '#/components/parameters/Include'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/SortBySlug'
        - name: type
          in: query
          description: Filter by organization type.
          schema:
            $ref: '#/components/schemas/OrganizationType'
      responses:
        '200':
          $ref: '#/components/responses/OrganizationCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /v1/organizations/{slug}:
    get:
      operationId: getOrganization
      tags: [Organizations]
      summary: Get an organization by stable slug
