  /v1/sources/{id}:
    get:
      operationId: getSource
      tags: [Sources]
      summary: Get a compact official source reference
      description: Source responses contain bibliographic references, not copyrighted source text.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Language'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AsOfChapter'
        - $ref: '#/components/parameters/MaxChapter'
      responses:
        '200':
          $ref: '#/components/responses/Source'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Stable, non-localized resource identifier.
      schema:
        type: string
        minLength: 1
    Language:
      name: lang
      in: query
      description: Explicit language override. If omitted, Accept-Language is considered. Fields fall back to the base language and then English.
      schema:
        type: string
        examples: [en, es, es-ES, ja]
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: Used when `lang` is absent. Resolved values are reported in `Content-Language`.
      schema:
        type: string
    AsOfChapter:
      name: asOfChapter
      in: query
      description: Select facts valid at this chapter in the story timeline.
      schema:
        type: integer
        minimum: 1
    MaxChapter:
      name: maxChapter
      in: query
      description: Hide facts that are not safely available to a reader through this chapter.
      schema:
        type: integer
        minimum: 1
    Include:
      name: include
      in: query
      description: |
        Comma-separated route-specific allowlist of bounded related resources.
        Characters accept bounties, organizations, devilFruits, haki, statusHistory, and sources.
        Organizations accept members, relationships, locations, statusHistory, and sources.
        Volumes accept chapters and editions. Cover stories accept episodes.
        Other routes do not currently define includes. Unsupported values return a problem response.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - bounties
            - organizations
            - devilFruits
            - haki
            - members
            - relationships
            - locations
            - statusHistory
            - sources
            - chapters
            - editions
            - episodes
    PageLimit:
      name: page[limit]
      in: query
      description: Maximum number of items in this page.
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    PageCursor:
      name: page[cursor]
      in: query
      description: Opaque cursor bound to the current query, locale, and temporal filters.
      schema:
        type: string
    SortBySlug:
      name: sort
      in: query
      description: Sort this collection by its stable slug in ascending order.
      schema:
        type: string
        enum: [slug]
    SortByNumber:
      name: sort
      in: query
      description: Sort this collection by its main-series number in ascending order.
      schema:
        type: string
        enum: [number]

  headers:
    ContentLanguage:
      description: Comma-separated locales actually used by localized fields, ordered by fallback priority.
      schema:
        type: string
        examples: ["es, en", en]
    LanguageVary:
      description: Responses selected using Accept-Language vary on that header.
      schema:
        type: string
        example: Accept-Language

  responses:
    BadRequest:
      description: Invalid language, query parameter, filter, or include value.
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/LanguageVary'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource is unknown or hidden by spoiler filtering.
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/LanguageVary'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request rate limit exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerError:
      description: Unexpected server failure without internal details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CharacterCollection:
      description: Paginated visible characters
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/LanguageVary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CharacterCollection'
    OrganizationCollection:
      description: Paginated visible organizations
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/LanguageVary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrganizationCollection'
    RaceCollection:
      description: Paginated visible races
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/LanguageVary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RaceCollection'
    LocationCollection:
      description: Paginated visible locations
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/LanguageVary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocationCollection'
    DevilFruitCollection:
      description: Paginated visible Devil Fruits
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/LanguageVary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DevilFruitCollection'
    SagaCollection:
      description: Paginated visible sagas
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
          $ref: '#/components/headers/LanguageVary'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SagaCollection'
    ArcCollection:
      description: Paginated visible arcs
      headers:
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        Vary:
