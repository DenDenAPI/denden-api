services:
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/dendenapi
      DATABASE_USER: dendenapi
      DATABASE_PASSWORD: dendenapi
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dendenapi
      POSTGRES_USER: dendenapi
      POSTGRES_PASSWORD: dendenapi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dendenapi -d dendenapi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
